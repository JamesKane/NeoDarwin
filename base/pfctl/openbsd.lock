# OpenBSD's pfctl as released in OpenBSD 4.3 (sbin/pfctl less its ALTQ
# files, and the userland pf_ruleset.c from sys/net), which
# base/pfctl/build.sh builds as /sbin/pfctl against xnu's
# <net/pfvar.h> (docs/base/pf-ntp.md). xnu's pf is OpenBSD's of the same
# months: its pfvar.h is OpenBSD 1.259 (2007-12-02), pf.c 1.567
# (2008-02-20). Apple publishes no pfctl. Also etc/pf.os, the passive OS
# fingerprints pfctl loads. Fetched unmodified by //rules:pinned_files.bzl;
# base/pfctl/patches applies NeoDarwin's changes.
# Repository: https://github.com/openbsd/src (the CVS history as git)
