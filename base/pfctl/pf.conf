#
# /etc/pf.conf: pf's main ruleset, macOS's (docs/base/pf-ntp.md).
#
# pf starts disabled. com.apple.pfctl (Disabled, as on macOS) loads this file
# and enables pf with a reference (pfctl -E) when it is turned on:
#   launchctl load -w /System/Library/LaunchDaemons/com.apple.pfctl.plist
# By hand: pfctl -f /etc/pf.conf, then pfctl -E (or -e); pfctl -X TOKEN
# releases a reference and pfctl -d disables pf outright.
#
# The ruleset is only anchor points, so pf passes everything until rules are
# loaded into an anchor or added below them. Keep the anchors when editing:
# the rules loaded into them depend on these points in the main ruleset.
# See pf.conf(5) for the syntax (OpenBSD 4.3's, with xnu's dummynet-anchor).
#

#
# com.apple anchor point
#
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"
