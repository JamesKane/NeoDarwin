# The WIDE project's DHCPv6 client (KAME's dhcp6c), as FreeBSD's ports build
# it: net/dhcp6 (20080615.2) is Hiroki Sato's (hrs@FreeBSD.org) maintained
# fork of WIDE-DHCPv6 20080615. base/dhcp6c/build.sh builds the client,
# /usr/sbin/dhcp6c (docs/kernel/network.md, "IPv6 DNS: RDNSS and DHCPv6");
# the server, relay and control tool aren't built. FreeBSD's base has no
# DHCPv6 client; Apple's is IPConfiguration's, a configd plugin. Fetched
# unmodified by //rules:pinned_files.bzl; base/dhcp6c/patches applies
# NeoDarwin's changes.
# Repository: https://github.com/hrs-allbsd/wide-dhcpv6 (tag v20080615.2)
# commit: 47f37dfab0cc789ab73ca772ced23e45ec7277cb
