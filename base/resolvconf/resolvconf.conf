# Configuration for resolvconf(8)
# See resolvconf.conf(5) for details
#
# NeoDarwin (docs/kernel/network.md, "IPv6 DNS: RDNSS and DHCPv6"): every
# source of name servers hands its lines to resolvconf -a <key> (dhclient's
# script as <interface>, rtsold's RDNSS and DNSSL as <interface>:slaac, or
# one per router with rtsold -u, dhcp6c's script as <interface>:dhcp6), and
# resolvconf writes them, merged, to /var/run/resolv.conf, which
# /etc/resolv.conf links to as on macOS. mDNSResponder answers every lookup
# from it and rereads it on SIGHUP. `resolvconf -l` lists each source.
# A static configuration: replace the /etc/resolv.conf link with a file, or
# add one with `resolvconf -a <name> < file`.

resolv_conf=/var/run/resolv.conf
resolv_conf_mv=YES
libc_restart='if [ -f /var/run/mDNSResponder.pid ]; then kill -HUP $(cat /var/run/mDNSResponder.pid); fi'
# If you run a local name server, you should uncomment the below line and
# configure your subscribers configuration files below.
#name_servers=127.0.0.1
