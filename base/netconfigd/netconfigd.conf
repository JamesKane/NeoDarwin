# /etc/netconfigd.conf: how netconfigd configures Ethernet interfaces at boot
# and when they appear (docs/kernel/network.md, "Bringing interfaces up").
#
#   ifconfig_<interface>="DHCP"      a lease from dhclient(8) (the default)
#   ifconfig_<interface>="<args>"    static: ifconfig <interface> <args> up,
#                                    e.g. "inet 192.0.2.10/24"
#   ifconfig_<interface>="NONE"      leave the interface alone
#   ifconfig_DEFAULT="..."           for en* interfaces without a line
#   defaultrouter="<address>"        route -n add default <address>, once a
#                                    static interface is configured
#
# IPv6 (docs/kernel/network.md, "P4-24: the rest of network_cmds and IPv6"):
#   ifconfig_<interface>_ipv6="AUTOCONF"   SLAAC from router advertisements,
#                                    with rtsold(8), which also passes their
#                                    DNS servers (RDNSS, DNSSL) to
#                                    resolvconf(8) (the default; FreeBSD's
#                                    "inet6 accept_rtadv" means the same)
#   ifconfig_<interface>_ipv6="<args>"     static: ifconfig <interface> <args>
#                                    up, e.g. "inet6 2001:db8::10 prefixlen 64"
#   ifconfig_<interface>_ipv6="NONE"       no IPv6 (the default for an
#                                    interface whose ifconfig_ line is NONE)
#   ifconfig_DEFAULT_ipv6="..."      for en* interfaces without a line
#   ipv6_defaultrouter="<address>"   route -n add -inet6 default <address>,
#                                    once a static interface is configured
#
# DHCPv6 on an AUTOCONF interface (docs/kernel/network.md, "IPv6 DNS: RDNSS
# and DHCPv6"), by dhcp6c(8), which rtsold starts:
#   ifconfig_<interface>_dhcp6="AUTO"      as router advertisements say:
#                                    stateful (an address and the name
#                                    servers) when M is set, stateless
#                                    (the name servers only) when O is
#                                    (the default)
#   ifconfig_<interface>_dhcp6="INFORM"    stateless, whatever the flags
#   ifconfig_<interface>_dhcp6="ADDRESS"   stateful, whatever the flags
#   ifconfig_<interface>_dhcp6="NONE"      never
#   ifconfig_DEFAULT_dhcp6="..."     for en* interfaces without a line
#   rtsold_flags="..."               more rtsold(8) options, e.g. "-d"
#
# Name servers: DHCP, RDNSS and DHCPv6 each hand theirs to resolvconf(8),
# which merges them into /var/run/resolv.conf (/etc/resolv.conf links to
# it); see /etc/resolvconf.conf. A static configuration adds none: add
# them with `resolvconf -a <name> < file`, or replace the /etc/resolv.conf
# link with a file.
ifconfig_DEFAULT="DHCP"
