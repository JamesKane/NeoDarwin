# /etc/ntp.conf: the servers NeoDarwin's NTP client sets the clock from
# (com.neodarwin.sntp, docs/base/pf-ntp.md). sntp-wrapper tries each
# "server" or "pool" line in order and stops at the first that answers;
# options after the host (ntpd's, such as iburst) are ignored. host:port
# names a server on another port. The job is off by default:
#   launchctl load -w /System/Library/LaunchDaemons/com.neodarwin.sntp.plist
pool pool.ntp.org iburst
