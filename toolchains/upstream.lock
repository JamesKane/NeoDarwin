# The pinned host toolchain (P0-02; toolchains/README.md). Must match the
# nd_swift_toolchain, nd_llvm_toolchain and nd_macos_sdk pins in MODULE.bazel.
#
# swift   swift.org's macOS toolchain .pkg (universal), expanded with
#         `pkgutil --expand-full`, never installed. The release that matches
#         Xcode 27.0's Swift 6.4; it ships the Embedded stdlib for
#         aarch64-none-none-elf and arm64-apple-macos, and lld-link.
# llvm    llvm.org's macOS arm64 release. The sha256 is the one GitHub's
#         release attestation (LLVM-23.1.3-macOS-ARM64.tar.xz.jsonl) records.
# sdk     the host-installed macOS SDK, pinned in place (it can't be
#         redistributed): SDKSettings.json Version, and toolchains/sdk/sdk_hash.sh
#         over the whole tree (sorted paths; sha256 of each file, target of each
#         symlink). The Command Line Tools 27.0 (CLTools_Executables
#         27.0.0.0.1788430756) install it at
#         /Library/Developer/CommandLineTools/SDKs/MacOSX27.0.sdk. Xcode 27.0's
#         MacOSX27.0.sdk differs in a few files, so it doesn't match.
