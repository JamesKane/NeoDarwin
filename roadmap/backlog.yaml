# NeoDarwin backlog — machine-readable source of truth for epics.
# Schema: id, title, phase, owner (agent workstream), status (todo|doing|host|done|dropped; host = works on a macOS/Linux host, not yet on NeoDarwin),
#         depends (ids), exit (test that closes it), doc (design reference), superseded_by (optional)
# Owners: build, loader, kernel-bridge, iokit-platform, acpi, storage, userland, verification, dt-abi-keeper,
#         packaging, drivers, graphics, namespaces, security, arch-amd64, arch-riscv64
schema: 1
